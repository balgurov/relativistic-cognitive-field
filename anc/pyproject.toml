[project]
name = "rcf"
version = "0.1.0"
description = "Reference implementation of the Relativistic Cognitive Field activation function"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rcf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
